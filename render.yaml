services:
  - type: web
    name: ychat-app
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: ychat-db
          property: connectionString

databases:
  - name: ychat-db
    databaseName: ychatapp
    user: ychat_user
    plan: free
